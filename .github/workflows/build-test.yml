name: Build Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Diagnose
        run: |
          echo "=== _site/publications ==="
          ls -la _site/publications/ || echo "NO publications dir"
          echo "=== _site/publication ==="
          ls -R _site/publication/ || echo "NO publication dir"
          echo "=== greps in index ==="
          for p in "Junteng Liu" "SynLogic" "C-Eval" "jliugi@connect.ust.hk" "Vicent0205" "Zhiyuan" "MINIMAX" "LLM Reasoning"; do
            if grep -q "$p" _site/index.html; then echo "OK: $p"; else echo "MISSING: $p"; fi
          done
          echo "=== publications page content check ==="
          if [ -f _site/publications/index.html ]; then
            for p in "SynLogic" "Perception Bottleneck" "Universal Truthfulness" "In-Context Sharpness" "C-Eval" "Composing Parameter"; do
              if grep -q "$p" _site/publications/index.html; then echo "OK: $p"; else echo "MISSING: $p"; fi
            done
          fi
