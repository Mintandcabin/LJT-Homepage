name: Build Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify
        run: |
          set -e
          test -f _site/index.html
          test -f _site/publications/index.html
          grep -q "Junteng Liu" _site/index.html
          grep -q "SynLogic" _site/index.html
          grep -q "C-Eval" _site/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "Vicent0205" _site/index.html
          grep -q "junteng88716710" _site/index.html
          grep -q "tbK9jl4AAAAJ" _site/index.html
          test -f _site/publication/2025-09-01-synlogic.html
          test -f _site/publication/2025-02-01-perception-bottleneck-vlms.html
          test -f _site/publication/2024-11-01-universal-truthfulness-hyperplane.html
          test -f _site/publication/2024-07-01-in-context-sharpness.html
          test -f _site/publication/2023-12-01-ceval.html
          test -f _site/publication/2023-10-01-composing-peft-modules.html
          ! grep -q "Paper Title Number" _site/publications/index.html
          ! grep -q "Academic Pages is a ready-to-fork" _site/index.html
          ! grep -q "Red Brick University" _site/index.html
          ! grep -q "none@example.org" _site/index.html
          echo "ALL CHECKS PASSED"
