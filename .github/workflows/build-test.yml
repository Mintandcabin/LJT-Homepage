name: Build Test

on:
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Try enabling Pages
        run: |
          gh api --method POST /repos/${{ github.repository }}/pages \
            -f 'source[branch]=master' -f 'source[path]=/' || echo "ENABLE_FAILED"
          gh api /repos/${{ github.repository }}/pages || echo "GET_FAILED"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
